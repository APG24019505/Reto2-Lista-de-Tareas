<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App Web - Lista de Tareas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        
        <img src="img/logo.webp" alt="Icono de Lista de Tareas" class="app-logo" loading="lazy">
        
        <h1>Mi Lista de Tareas</h1>
        <p class="subtitle">Reto 2 - Despliegue de Aplicaciones Web</p>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Escribe una nueva tarea...">
            <button id="addBtn">Agregar</button>
        </div>

        <ul id="taskList">
            <!-- Aquí se cargan las tareas -->
        </ul>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
